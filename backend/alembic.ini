# Alembic configuration.
#
# The database URL is deliberately NOT set here. env.py reads it from
# app.core.config.settings so there is one source of truth, and so migrations
# can target a direct endpoint (MIGRATION_DATABASE_URL) when the application
# itself runs through a transaction-mode pooler, where DDL and advisory locks
# are unreliable.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
