<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Synapse</title>
</head>
<body>
  <div class="header">
    <span class="logo">Synapse</span>
    <span class="tagline">Cognitive settings</span>
  </div>

  <div id="update-banner" class="update-banner" style="display:none">
    <span class="update-icon">*</span>
    <span id="update-msg">Synapse updated your profile.</span>
    <button id="dismiss-update" class="update-dismiss">x</button>
  </div>

  <div class="section">
    <label>Reading type</label>
    <select id="profile-type">
      <option value="load-reducer">Load Reducer</option>
      <option value="comprehension-gap">Comprehension Gap</option>
      <option value="hyperfocus">Hyperfocus Reader</option>
    </select>
  </div>

  <div class="section">
    <label>Preferred format</label>
    <select id="format">
      <option value="bullet points">Bullet points &amp; lists</option>
      <option value="short paragraphs">Short paragraphs</option>
      <option value="numbered steps">Numbered steps</option>
      <option value="plain flowing prose">Plain flowing prose</option>
    </select>
  </div>

  <div class="grid-2">
    <div class="section">
      <label>Chunk size</label>
      <select id="chunk-size">
        <option value="short">Short</option>
        <option value="medium">Medium</option>
        <option value="long">Long</option>
      </select>
    </div>
    <div class="section">
      <label>Nesting</label>
      <select id="nesting">
        <option value="1">1 level</option>
        <option value="2">2 levels</option>
        <option value="3">3 levels</option>
      </select>
    </div>
  </div>

  <div class="toggle-row">
    <label><input type="checkbox" id="examples-first"> Examples first</label>
    <label><input type="checkbox" id="simplify-vocab"> Simplify vocab</label>
    <label><input type="checkbox" id="use-headers"> Section headers</label>
  </div>

  <div class="section">
    <label>User notes</label>
    <textarea id="notes" placeholder="e.g. I lose focus after 3 nested points. I need concrete examples before concepts."></textarea>
  </div>

  <button id="save-btn">Save profile</button>
  <div id="status"></div>

  <div class="divider"></div>

  <div class="section">
    <label>Backend API URL</label>
    <input id="backend-url" type="url" placeholder="http://localhost:8000">
  </div>

  <div class="section">
    <label>Account</label>
    <p id="account-status" class="feedback-stats">Checking sign-in…</p>
    <a id="dashboard-link" href="#" target="_blank" rel="noopener noreferrer" class="feedback-stats" style="text-decoration:underline">Sign in on the Synapse dashboard</a>
  </div>

  <p id="billing-status" class="feedback-stats">Billing status not checked.</p>

  <button id="save-provider-btn" class="secondary">Save backend settings</button>
  <p id="usage-stats" class="feedback-stats">Loading usage...</p>

  <div class="divider"></div>

  <div class="feedback-section">
    <div class="feedback-header">
      <span class="feedback-title">Learning history</span>
      <button id="clear-feedback" class="clear-btn">Clear</button>
    </div>
    <p id="feedback-stats" class="feedback-stats">Loading...</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
